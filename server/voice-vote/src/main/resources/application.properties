spring.application.name=talkinghead-vote-server
server.address=127.0.0.1
server.port=${VOICE_VOTE_PORT:8081}
server.error.include-message=never
voice-vote.database=${VOICE_VOTE_DB:../../data/voice-vote/votes.sqlite}
voice-vote.catalogue=${VOICE_VOTE_CATALOGUE:../../data/voice-vote/catalogue.json}
voice-vote.secure-cookie=${VOICE_VOTE_SECURE_COOKIE:false}
voice-vote.admin-password-file=${VOICE_VOTE_ADMIN_PASSWORD_FILE:../../config/voice-vote-admin-password.local.txt}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=talkinghead_admin
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${VOICE_VOTE_SECURE_COOKIE:false}
server.tomcat.max-http-form-post-size=4KB
