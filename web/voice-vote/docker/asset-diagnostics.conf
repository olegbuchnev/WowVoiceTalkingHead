# Install in the host Nginx http context (/etc/nginx/conf.d/).
# The response ID comes from the container, linking all three diagnostic layers.
log_format talkinghead_assets escape=json '{"event":"asset_edge","time":"$time_iso8601","requestID":"$upstream_http_x_request_id","path":"$uri","status":$status,"bytes":$body_bytes_sent,"totalSeconds":$request_time,"upstreamSeconds":"$upstream_response_time","upstreamHeaderSeconds":"$upstream_header_time","protocol":"$server_protocol","encoding":"$sent_http_content_encoding"}';
map "$status:$uri" $talkinghead_log_asset {
    default 0;
    ~^[0-9]+:/modelviewer/.*\.(m2|skel)$ 1;
    ~^[0-9]+:/api/portrait-camera/ 1;
    ~^[0-9]+:/api/audio/ 1;
    ~^[45][0-9][0-9]:/modelviewer/ 1;
}
