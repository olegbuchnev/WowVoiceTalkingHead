# Install in the host Nginx http context (/etc/nginx/conf.d/).
# The response ID comes from the container, linking all three diagnostic layers.
log_format talkinghead_assets escape=json '{"event":"asset_edge","time":"$time_iso8601","edgeRequestID":"$request_id","requestID":"$upstream_http_x_request_id","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"totalSeconds":$request_time,"upstreamStatus":"$upstream_status","upstreamConnectSeconds":"$upstream_connect_time","upstreamSeconds":"$upstream_response_time","upstreamHeaderSeconds":"$upstream_header_time","protocol":"$server_protocol","encoding":"$sent_http_content_encoding"}';
map "$status:$uri" $talkinghead_log_asset {
    default 0;
    # Capture initial navigation and bootstrap even before browser telemetry starts.
    ~^[0-9]+:/$ 1;
    ~^[0-9]+:/index\.html$ 1;
    ~^[0-9]+:/assets/ 1;
    ~^[0-9]+:/api/catalogue$ 1;
    ~^[0-9]+:/api/votes/(queue|summary|health)$ 1;
    # Include edge/upstream failures on every path, not only model resources.
    ~^[45][0-9][0-9]: 1;
    ~^[0-9]+:/modelviewer/.*\.(m2|skel)$ 1;
    ~^[0-9]+:/api/portrait-camera/ 1;
    ~^[0-9]+:/api/audio/ 1;
}
