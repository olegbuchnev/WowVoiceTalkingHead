worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 16k;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    resolver 127.0.0.11 valid=10s ipv6=off;
    map $http_sec_fetch_site $foreign_site {
        default 0;
        cross-site 1;
        same-site 1;
    }
    map "$http_origin|$http_host" $foreign_origin {
        default 1;
        ~^\| 0;
        ~^https?://([^/]+)\|\1$ 0;
    }
    map $cookie_talkinghead_voter $voting_key {
        default $cookie_talkinghead_voter;
        "" $binary_remote_addr;
    }
    limit_req_zone $voting_key zone=voting:10m rate=10r/s;
    server {
        listen 8080;
        root /app/web/voice-vote/dist;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        set $java http://api:8081;
        location = /health {
            proxy_pass http://127.0.0.1:8082/health;
        }
        location ~ ^/(?:api/votes(?:/|$)|api/admin(?:/|$)|admin(?:/|$)) {
            if ($foreign_site) { return 403; }
            if ($foreign_origin) { return 403; }
            limit_req zone=voting burst=100 nodelay;
            limit_req_status 429;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_pass $java;
            proxy_read_timeout 30s;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
        }
        location /api/ {
            if ($foreign_site) { return 403; }
            if ($foreign_origin) { return 403; }
            proxy_pass http://127.0.0.1:8082;
            proxy_read_timeout 40s;
        }
        location /modelviewer/ {
            proxy_pass http://127.0.0.1:8082;
            proxy_read_timeout 40s;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control no-cache;
        }
    }
}
